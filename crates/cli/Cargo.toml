[package]
name = "dw"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "dw"
path = "src/main.rs"

[dependencies]
dw-ingest = { path = "../ingest" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
pyo3 = { version = "0.22", features = ["auto-initialize"] }
pythonize = "0.22"
