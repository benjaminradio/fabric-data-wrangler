name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

env:
  # python-build-standalone release to pull from. "latest" resolves
  # dynamically to whatever astral-sh/python-build-standalone most recently
  # published; pin a specific tag (e.g. "20240814") here if you need
  # reproducibility.
  PBS_RELEASE_TAG: latest
  PBS_PYTHON_SERIES: "3.11"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runners ship Git Bash; using it for every step lets the
        # Linux and Windows jobs share one script, branching on $RUNNER_OS
        # only where the two platforms genuinely differ (library/executable
        # naming, stdlib directory layout).
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Resolve python-build-standalone release
        id: pbs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$PBS_RELEASE_TAG" = "latest" ]; then
            release_json=$(gh api repos/astral-sh/python-build-standalone/releases/latest)
          else
            release_json=$(gh api "repos/astral-sh/python-build-standalone/releases/tags/$PBS_RELEASE_TAG")
          fi

          # "install_only" is the plain, standard, well-supported flavor --
          # a redistributable Python runtime dynamically linked against its
          # own libpython/DLL (what pyenv/uv/etc. use under the hood) -- as
          # opposed to the "full" build-artifact flavor, which turned out to
          # give a genuinely static libpython on Linux but only a partial,
          # unusable one on Windows (see git history). Since dw now ships
          # its Python shared library alongside the binary on both
          # platforms anyway (see "Package artifact" below), there's no
          # reason to chase the more complex "full" flavor's static linking
          # only to still need extra static libs for stdlib extensions.
          asset_url=""
          for variant in "install_only" "install_only_stripped"; do
            asset_url=$(echo "$release_json" | jq -r --arg series "cpython-$PBS_PYTHON_SERIES." --arg triple "${{ matrix.triple }}" --arg variant "$variant" \
              '.assets[] | select(.name | startswith($series)) | select(.name | contains($triple)) | select((.name | endswith($variant + ".tar.gz")) or (.name | endswith($variant + ".tar.zst"))) | .browser_download_url' \
              | head -n1)
            if [ -n "$asset_url" ]; then
              echo "Selected variant: $variant"
              break
            fi
          done

          if [ -z "$asset_url" ]; then
            echo "::error::No matching python-build-standalone asset found for series=$PBS_PYTHON_SERIES triple=${{ matrix.triple }}"
            echo "$release_json" | jq -r '.assets[].name'
            exit 1
          fi

          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"
          echo "Resolved asset: $asset_url"

      - name: Download and extract python-build-standalone
        run: |
          set -euo pipefail
          mkdir -p pbs
          URL="${{ steps.pbs.outputs.asset_url }}"
          case "$URL" in
            *.tar.zst) EXT=tar.zst ;;
            *.tar.gz) EXT=tar.gz ;;
            *) echo "::error::unrecognized archive extension: $URL"; exit 1 ;;
          esac
          curl -sSL "$URL" -o "pbs.$EXT"
          if [ "$EXT" = "tar.zst" ]; then
            tar --zstd -xf "pbs.$EXT" -C pbs
          else
            tar -xzf "pbs.$EXT" -C pbs
          fi
          find pbs -maxdepth 2

      - name: Generate pyo3 dynamic-link config
        id: pyo3cfg
        run: |
          set -euo pipefail

          # dw dynamically links Python on both platforms (see the
          # "install_only" note above) and ships the shared
          # library/DLL alongside the binary, the same way any program
          # ships its runtime dependencies -- DW_PYLIB below is that file.
          # The "install_only" flavor extracts to a flat
          # python/{bin,lib,include,share} layout with no "install/"
          # middle directory (unlike the old "full" flavor's nested
          # python/{build,install}/... layout) -- so these patterns must
          # not require "install/" anywhere in the path.
          if [ "$RUNNER_OS" = "Windows" ]; then
            IMPORT_LIB=$(find pbs -ipath '*/libs/python3[0-9][0-9].lib' | head -n1)
            DW_PYLIB=$(find pbs -iname 'python3[0-9][0-9].dll' | grep -vi '/venv/' | head -n1)
            # Exclude the venv module's own bundled launcher stub
            # (Lib/venv/scripts/nt/python.exe) -- not the real interpreter.
            PYEXE=$(find pbs -iname 'python.exe' | grep -vi '/venv/' | sort | head -n1)
          else
            IMPORT_LIB=$(find pbs -name 'libpython3.*.so*' | sort | head -n1)
            DW_PYLIB="$IMPORT_LIB"
            PYEXE=$(find pbs -type f -path '*/bin/python3.*' | grep -v config || true)
            PYEXE=$(echo "$PYEXE" | head -n1)
          fi

          if [ -z "$IMPORT_LIB" ]; then
            echo "::error::No python link library found in the downloaded distribution"
            find pbs -iname '*python3*'
            exit 1
          fi
          if [ -z "$PYEXE" ]; then
            echo "::error::No python executable found in the downloaded distribution"
            exit 1
          fi
          if [ -z "$DW_PYLIB" ]; then
            echo "::error::No python shared library/DLL found in the downloaded distribution"
            exit 1
          fi
          chmod +x "$PYEXE" || true

          # Must be absolute: pyo3-build-config emits these paths verbatim
          # into cargo:rustc-link-search / the executable path it shells
          # out to, and a relative path here does not reliably resolve
          # against the crate's build directory.
          IMPORT_LIB=$(realpath "$IMPORT_LIB")
          PYEXE=$(realpath "$PYEXE")
          DW_PYLIB=$(realpath "$DW_PYLIB")
          echo "Link library: $IMPORT_LIB"
          echo "Python executable: $PYEXE"
          echo "Runtime shared library: $DW_PYLIB"

          LIB_DIR=$(dirname "$IMPORT_LIB")
          LIB_FILE=$(basename "$IMPORT_LIB")
          if [ "$RUNNER_OS" = "Windows" ]; then
            # MSVC has no "lib" stripping convention: the full stem (minus
            # the extension rustc adds back) is what the linker expects.
            LIB_NAME=${LIB_FILE%.lib}
          else
            LIB_NAME=${LIB_FILE#lib}
            LIB_NAME=${LIB_NAME%%.so*}
          fi
          PYVER=$("$PYEXE" -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')

          # pyo3-build-config's file is parsed by a native Rust build
          # script, which (on Windows) needs real Windows paths -- Git
          # Bash's own `realpath` above produces its MSYS/POSIX form
          # (e.g. /d/a/repo/repo), which Windows APIs cannot resolve.
          # $GITHUB_WORKSPACE itself is already a native path, so
          # config_path below doesn't need this, but lib_dir/executable
          # (derived from `realpath`) do.
          if [ "$RUNNER_OS" = "Windows" ]; then
            CFG_LIB_DIR=$(cygpath -w "$LIB_DIR")
            CFG_EXECUTABLE=$(cygpath -w "$PYEXE")
          else
            CFG_LIB_DIR="$LIB_DIR"
            CFG_EXECUTABLE="$PYEXE"
          fi

          CONFIG_PATH="$GITHUB_WORKSPACE/pyo3-build-config.txt"
          cat > "$CONFIG_PATH" <<EOF
          implementation=CPython
          version=$PYVER
          shared=true
          abi3=false
          lib_name=$LIB_NAME
          lib_dir=$CFG_LIB_DIR
          executable=$CFG_EXECUTABLE
          pointer_width=64
          build_flags=
          suppress_build_script_link_lines=false
          EOF

          echo "---- pyo3-build-config.txt ----"
          cat "$CONFIG_PATH"

          echo "config_path=$CONFIG_PATH" >> "$GITHUB_OUTPUT"

          # PYTHONHOME must point at the install *prefix*. On POSIX that's
          # two levels up from bin/python3.x, with the stdlib under
          # lib/pythonX.Y/; on Windows python.exe already sits at the
          # prefix root, with the stdlib directly under Lib/. Only used by
          # the freeze step below now (see python_runtime.rs -- with the
          # stdlib frozen in, dw itself no longer needs PYTHONHOME at all).
          if [ "$RUNNER_OS" = "Windows" ]; then
            STDLIB_DIR="$(dirname "$PYEXE")/Lib"
          else
            STDLIB_DIR="$(dirname "$(dirname "$PYEXE")")/lib/python$PYVER"
          fi
          echo "pyexe=$PYEXE" >> "$GITHUB_OUTPUT"
          echo "stdlib_dir=$STDLIB_DIR" >> "$GITHUB_OUTPUT"
          echo "pylib=$DW_PYLIB" >> "$GITHUB_OUTPUT"

      - name: Freeze the stdlib into bytecode
        id: freeze
        run: |
          set -euo pipefail
          FROZEN_DIR="$GITHUB_WORKSPACE/frozen-stdlib"
          # Must run with the exact interpreter whose Python library we're
          # linking: marshalled bytecode isn't portable across versions,
          # and frozen modules are unmarshalled with no magic-number check
          # to catch a mismatch (see scripts/freeze_stdlib.py's docstring).
          "${{ steps.pyo3cfg.outputs.pyexe }}" scripts/freeze_stdlib.py \
            "${{ steps.pyo3cfg.outputs.stdlib_dir }}" "$FROZEN_DIR"
          echo "---- frozen-stdlib dir ----"
          ls -la "$FROZEN_DIR"
          echo "frozen_dir=$FROZEN_DIR" >> "$GITHUB_OUTPUT"

      - name: Build (embedded interpreter, frozen stdlib)
        env:
          PYO3_CONFIG_FILE: ${{ steps.pyo3cfg.outputs.config_path }}
          DW_FROZEN_STDLIB_DIR: ${{ steps.freeze.outputs.frozen_dir }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Windows already searches the executable's own directory for
            # DLLs by default; the ELF equivalent needs an explicit rpath,
            # or dw would only find libpython*.so sitting right next to it
            # via LD_LIBRARY_PATH -- inconvenient and easy to forget,
            # unlike Windows' "just works" default. $ORIGIN is a literal
            # token the dynamic linker substitutes at load time (the
            # directory containing the running executable); it must reach
            # the linker unexpanded, hence the single quotes.
            export RUSTFLAGS='-C link-args=-Wl,-rpath,$ORIGIN'
          fi
          cargo build --release --workspace

      - name: Smoke test in total isolation (binary + its Python shared library only)
        run: |
          set -euo pipefail
          EXE_NAME=dw
          [ "$RUNNER_OS" = "Windows" ] && EXE_NAME=dw.exe
          # The whole point of freezing the stdlib in: no Lib/ or
          # lib/pythonX.Y/ directory needed, no PYTHONHOME/PYTHONPATH, not
          # even run from the repo checkout. Copy *only* the binary, the
          # one Python shared library/DLL it depends on, and the
          # input/script into an empty directory elsewhere, then run it
          # from there with a scrubbed environment -- deliberately *not*
          # setting LD_LIBRARY_PATH on Linux, since finding the library via
          # the rpath set above (i.e. with zero configuration, the same as
          # Windows finding the DLL next to the exe) is exactly what this
          # step is meant to prove.
          ISOLATED=$(mktemp -d)
          cp "target/release/$EXE_NAME" "$ISOLATED/$EXE_NAME"
          cp "${{ steps.pyo3cfg.outputs.pylib }}" "$ISOLATED/"
          cp examples/sample.csv examples/transform_example.py "$ISOLATED/"
          ls -la "$ISOLATED"
          cd "$ISOLATED"
          env -i PATH=/usr/bin:/bin \
            "./$EXE_NAME" --input sample.csv --script transform_example.py

      - name: Package artifact (binary + its one Python shared library)
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/dw.exe dist/dw.exe
            cp "${{ steps.pyo3cfg.outputs.pylib }}" dist/
            (cd dist && 7z a "$GITHUB_WORKSPACE/dw-${{ matrix.triple }}.zip" .)
          else
            cp target/release/dw dist/dw
            cp "${{ steps.pyo3cfg.outputs.pylib }}" dist/
            tar -C dist -czf dw-${{ matrix.triple }}.tar.gz .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dw-${{ matrix.triple }}
          path: |
            dw-${{ matrix.triple }}.tar.gz
            dw-${{ matrix.triple }}.zip
          if-no-files-found: ignore
